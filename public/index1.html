<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Usuario</title>
  <style>
    body {
      font-family: Arial;
      margin: 30px;
    }
    form {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #ccc;
      width: 300px;
    }
    input {
      display: block;
      margin-bottom: 10px;
      padding: 8px;
      width: 100%;
    }
    button {
      padding: 10px;
    }
    .message {
      color: green;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>

  <h2>Crear Usuario PRUEBA</h2>
  <form id="registerForm">
    <input type="text" id="regUsername" placeholder="Nombre de usuario" required />
    <input type="email" id="regEmail" placeholder="Correo electrónico" required />
    <input type="password" id="regPassword" placeholder="Contraseña" required />
    <button type="submit">Registrar</button>
    <p id="registerMessage"></p>
  </form>

  <h2>Actualizar Contraseña</h2>
  <form id="updateForm">
    <input type="text" id="updUsername" placeholder="Nombre de usuario" required />
    <input type="email" id="updEmail" placeholder="Correo electrónico" required />
    <input type="password" id="newPassword" placeholder="Nueva contraseña" required />
    <button type="submit">Actualizar Contraseña</button>
    <p id="updateMessage"></p>
  </form>

  <script>
    // Registro de usuario
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      const res = await fetch('/api/users/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password,email })
      });

      const data = await res.json();
      const messageEl = document.getElementById('registerMessage');

      if (res.ok) {
        messageEl.textContent = data.message;
        messageEl.className = 'message';
      } else {
        messageEl.textContent = data.error || 'Error al registrar';
        messageEl.className = 'error';
      }
    });

    // Actualizar contraseña
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('updUsername').value;
      const email = document.getElementById('updEmail').value;
      const newPassword = document.getElementById('newPassword').value;

      const res = await fetch('/api/users/update-password', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username,  newPassword,email })
      });

      const data = await res.json();
      const messageEl = document.getElementById('updateMessage');

      if (res.ok) {
        messageEl.textContent = data.message;
        messageEl.className = 'message';
      } else {
        messageEl.textContent = data.error || 'Error al actualizar';
        messageEl.className = 'error';
      }
    });
  </script>

</body>
</html>
